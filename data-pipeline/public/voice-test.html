<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice Agent Test Harness</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  #status { font-weight: bold; }
  #controls { margin: 1rem 0; display: flex; gap: 0.5rem; align-items: center; }
  #textInput { flex: 1; padding: 0.4rem; }
  .turn { border: 1px solid #ccc; border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .turn .input { color: #555; }
  .turn .tool { background: #f5f5f5; border-radius: 6px; padding: 0.5rem; margin: 0.5rem 0; font-family: monospace; font-size: 0.9em; white-space: pre-wrap; }
  .turn .tool .label { font-weight: bold; font-family: system-ui, sans-serif; }
  .turn .reply { margin-top: 0.5rem; }
  .error { color: #b00020; font-weight: bold; }
  #talkBtn.listening { background: #b00020; color: #fff; }
</style>
</head>
<body>
  <h1>Voice Agent Test Harness</h1>
  <p>Testing tool only — not the iPhone prototype. Connect, then either click the mic to talk or just type — the mic stays off otherwise.</p>

  <div id="status">disconnected</div>
  <div id="controls">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
    <button id="talkBtn" disabled>🎤 Start Talking</button>
    <input id="textInput" type="text" placeholder="Or type a message..." disabled>
    <button id="sendBtn" disabled>Send</button>
  </div>
  <audio id="remoteAudio" autoplay></audio>

  <div id="turns"></div>

  <script>
    const DATA_CHANNEL_LABEL = "oai-events"; // swap to "realtime-channel" if events never arrive

    const statusEl = document.getElementById("status");
    const connectBtn = document.getElementById("connectBtn");
    const disconnectBtn = document.getElementById("disconnectBtn");
    const talkBtn = document.getElementById("talkBtn");
    const textInput = document.getElementById("textInput");
    const sendBtn = document.getElementById("sendBtn");
    const remoteAudio = document.getElementById("remoteAudio");
    const turnsEl = document.getElementById("turns");

    let peerConnection = null;
    let dataChannel = null;
    let micStream = null;
    let toolCompletionPromise = null;
    let currentTurnEl = null;
    let listening = false; // push-to-talk state — see toggleTalk()

    // --- Stall/loop hardening ---------------------------------------------
    // A live debugging session found the model narrating "let me check.../
    // still searching..." indefinitely with no tool call ever completing and
    // no visible failure. Root cause was investigated thoroughly (protocol
    // research + adversarial review) but the exact external trigger was not
    // pinned with certainty — candidates include a documented Azure gap
    // where semantic_vad's turn_detection is silently not honored, an
    // Azure-side response.done status of "failed"/"cancelled", or the model
    // simply narrating without invoking a real tool call. What IS certain,
    // confirmed independently by every reviewer: this file never guarded
    // against sending a duplicate response.create, never inspected
    // response.done's status, and never gave up on a stalled turn — so any
    // one of those triggers produced a silent stall or an unbounded loop.
    // These three additions close that regardless of which trigger is real.
    let responseActive = false;
    let watchdogTimer = null;
    const WATCHDOG_MS = 15000; // generous — /run-tool is a local, synchronous-fast call

    function startWatchdog() {
      clearWatchdog();
      watchdogTimer = setTimeout(() => {
        showError("No response after 15s — the model or a tool call may be stuck. Please try again.");
        responseActive = false;
        toolCompletionPromise = null;
        finishTurn();
      }, WATCHDOG_MS);
    }

    function clearWatchdog() {
      if (watchdogTimer) {
        clearTimeout(watchdogTimer);
        watchdogTimer = null;
      }
    }

    // Live testing caught input_audio_buffer.speech_started/speech_stopped
    // firing repeatedly on a continuously-open mic — every ~1.3s, all
    // session long — some real, some plausibly ambient noise/echo the
    // browser's default echo cancellation wasn't fully rejecting in that
    // environment. A continuously-open mic is also just wasteful: it keeps
    // streaming audio (and burning tokens) whether or not anyone is
    // actually talking. Fixed by dropping "always listening" entirely: the
    // mic starts OFF right after connect() and is only ever enabled for the
    // explicit push-to-talk window between the two toggleTalk() clicks —
    // see connect() and toggleTalk() below. Kept as a named helper (rather
    // than inlining track.enabled = ...) since it is also still used as a
    // safety net while a response is generating, in requestResponse().
    function setMicEnabled(enabled) {
      if (micStream) micStream.getTracks().forEach((t) => { t.enabled = enabled; });
    }

    // Push-to-talk: click once to open the mic, click again to close it and
    // send the turn. Deliberately NOT relying on VAD's speech_stopped to
    // decide when the user is done (see the removed case in
    // handleServerEvent) — an explicit second click is simpler, uses no
    // mic time beyond what the user actually intends, and removes an entire
    // class of timing bugs this file has already been through once.
    function toggleTalk() {
      listening = !listening;
      setMicEnabled(listening);
      talkBtn.textContent = listening ? "⏹ Stop & Send" : "🎤 Start Talking";
      talkBtn.classList.toggle("listening", listening);
      logToServer("talk", { listening });
      if (!listening) requestResponse();
    }

    // The one place a response.create is ever sent — replaces three
    // separate unconditional call sites. Guards against the exact defect
    // every reviewer confirmed: sending response.create while a response is
    // already active either errors ("conversation_already_has_active_response",
    // the same class of race already fixed once in this file for tool-call
    // continuations) or — worse — silently starts a redundant response on
    // top of one that's still generating.
    function requestResponse() {
      if (responseActive) {
        console.log("[guard] response already active — skipping duplicate response.create");
        logToServer("guard-skip", {});
        return;
      }
      responseActive = true;
      setMicEnabled(false);
      sendEvent({ type: "response.create" });
      startWatchdog();
    }

    // Debugging so far has depended on someone manually copy-pasting the
    // browser console, which is slow and loses earlier lines once the
    // console scrolls. This mirrors every status change, error, and
    // data-channel event to the broker (POST /client-log), which appends
    // them to data-pipeline/logs/client-events.log — a plain file that can
    // be read directly server-side, no copy-paste needed. Fire-and-forget:
    // a failed log POST must never affect the actual voice session.
    function logToServer(tag, data) {
      fetch("/client-log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tag, data, ts: new Date().toISOString() }),
      }).catch(() => {});
    }

    function setStatus(text) {
      statusEl.textContent = text;
      logToServer("status", { text });
    }

    function setConnectedUi(connected) {
      connectBtn.disabled = connected;
      disconnectBtn.disabled = !connected;
      talkBtn.disabled = !connected;
      textInput.disabled = !connected;
      sendBtn.disabled = !connected;
      if (!connected) {
        listening = false;
        talkBtn.textContent = "🎤 Start Talking";
        talkBtn.classList.remove("listening");
      }
    }

    function startTurn(inputLabel) {
      currentTurnEl = document.createElement("div");
      currentTurnEl.className = "turn";
      currentTurnEl.innerHTML = `<div class="input">${inputLabel}</div>`;
      turnsEl.appendChild(currentTurnEl);
      return currentTurnEl;
    }

    function ensureTurn() {
      // A voice turn has no client-side transcript (no input transcription
      // model configured — see the design spec's Global Constraints); it
      // starts on the first server event we see for it, labeled generically.
      if (!currentTurnEl) startTurn("🎤 (spoken input)");
      return currentTurnEl;
    }

    function renderToolCall(name, argumentsJson) {
      const turn = ensureTurn();
      const div = document.createElement("div");
      div.className = "tool";
      let pretty = argumentsJson;
      try { pretty = JSON.stringify(JSON.parse(argumentsJson), null, 2); } catch {}
      div.innerHTML = `<div class="label">🔧 Tool called: ${name}</div>${pretty}`;
      turn.appendChild(div);
    }

    function renderToolResult(resultJson) {
      const turn = ensureTurn();
      const div = document.createElement("div");
      div.className = "tool";
      let pretty = resultJson;
      try { pretty = JSON.stringify(JSON.parse(resultJson), null, 2); } catch {}
      div.innerHTML = `<div class="label">📦 Tool returned:</div>${pretty}`;
      turn.appendChild(div);
    }

    function appendReply(deltaText) {
      const turn = ensureTurn();
      let replyEl = turn.querySelector(".reply");
      if (!replyEl) {
        replyEl = document.createElement("div");
        replyEl.className = "reply";
        replyEl.innerHTML = `<span class="label">💬 Agent replied:</span> `;
        turn.appendChild(replyEl);
      }
      replyEl.append(deltaText);
    }

    function finishTurn() {
      currentTurnEl = null;
      // Deliberately does NOT re-enable the mic — push-to-talk means the
      // mic only ever turns back on when the user explicitly clicks
      // talkBtn again (toggleTalk()), never automatically after a turn.
      logToServer("turn-finished", {});
    }

    function showError(text) {
      const div = document.createElement("div");
      div.className = "error";
      div.textContent = `⚠ ${text}`;
      (currentTurnEl ?? turnsEl).appendChild(div);
      logToServer("error", { text });
    }

    function sendEvent(obj) {
      console.log("[dc:out]", obj.type, obj);
      logToServer("dc:out", obj);
      dataChannel.send(JSON.stringify(obj));
    }

    async function runToolOnBroker(callId, name, argumentsJson) {
      const res = await fetch("/run-tool", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, argumentsJson }),
      });
      const resultJson = await res.text();
      renderToolResult(resultJson);
      sendEvent({
        type: "conversation.item.create",
        item: { type: "function_call_output", call_id: callId, output: resultJson },
      });
    }

    function handleServerEvent(evt) {
      console.log("[dc:in]", evt.type, evt);
      logToServer("dc:in", evt);
      switch (evt.type) {
        case "session.updated": {
          // Master-plan risk, never actually verified until now: Azure has
          // been reported to silently accept semantic_vad in session.update
          // without honoring it. Assert on the echo so a silent VAD
          // mismatch shows up here instead of masquerading as this bug.
          const actualType = evt.session?.audio?.input?.turn_detection?.type;
          if (actualType !== "semantic_vad") {
            console.warn(`[session] Azure did NOT honor semantic_vad turn_detection (got "${actualType}"). VAD behavior may differ from what this page assumes — see docs/challenge-02-voice-agent-plan.md risks table.`);
          } else {
            console.log("[session] semantic_vad confirmed active.");
          }
          break;
        }
        // input_audio_buffer.speech_started/speech_stopped are intentionally
        // not acted on — push-to-talk (toggleTalk()) decides when a turn is
        // sent, not VAD. Still visible in the generic dc:in log above for
        // diagnostics (e.g. confirming the mic really is silent outside the
        // push-to-talk window).
        case "response.output_audio_transcript.delta":
          appendReply(evt.delta ?? "");
          break;
        case "response.function_call_arguments.done":
          renderToolCall(evt.name, evt.arguments);
          toolCompletionPromise = runToolOnBroker(evt.call_id, evt.name, evt.arguments);
          break;
        case "response.done":
          responseActive = false;
          if (evt.status && evt.status !== "completed") {
            // The response ended without completing normally — cancelled
            // (server-side barge-in), failed (an Azure server_error), or
            // incomplete. Previously this was silently treated exactly like
            // a normal completion, which is precisely the "illusion of
            // progress" the live test surfaced: the model would narrate
            // "still searching" and the turn would just quietly end with no
            // tool call ever rendered and nothing told to the user.
            clearWatchdog();
            toolCompletionPromise = null;
            const detail = evt.status_details ? `: ${JSON.stringify(evt.status_details)}` : "";
            showError(`Response ended without completing (status: ${evt.status}${detail}). The data may be unavailable — try asking again.`);
            finishTurn();
            break;
          }
          if (toolCompletionPromise) {
            const promise = toolCompletionPromise;
            toolCompletionPromise = null;
            promise.then(() => {
              requestResponse();
            });
          } else {
            clearWatchdog();
            finishTurn();
          }
          break;
        case "error":
          clearWatchdog();
          responseActive = false;
          toolCompletionPromise = null;
          showError(JSON.stringify(evt));
          finishTurn(); // also releases the mic — otherwise a protocol-level error leaves it muted forever
          break;
      }
    }

    async function connect() {
      try {
        setStatus("connecting...");
        const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
        peerConnection = pc;

        pc.ontrack = (event) => { remoteAudio.srcObject = event.streams[0]; };

        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micStream.getTracks().forEach((track) => pc.addTrack(track, micStream));
        setMicEnabled(false); // push-to-talk: mic stays off until the user explicitly clicks talkBtn

        const dc = pc.createDataChannel(DATA_CHANNEL_LABEL);
        dataChannel = dc;
        dc.onopen = () => { setStatus("connected"); setConnectedUi(true); };
        dc.onmessage = (event) => handleServerEvent(JSON.parse(event.data));
        dc.onerror = (event) => showError(`Data channel error: ${JSON.stringify(event)}`);

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        const res = await fetch("/connect", {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: offer.sdp,
        });
        if (!res.ok) {
          const detail = await res.text();
          showError(`/connect failed (${res.status}): ${detail}`);
          disconnect();
          return;
        }
        const answerSdp = await res.text();
        await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
      } catch (err) {
        showError(err.message);
        disconnect();
      }
    }

    function disconnect() {
      if (dataChannel) dataChannel.close();
      if (peerConnection) peerConnection.close();
      if (micStream) micStream.getTracks().forEach((t) => t.stop());
      dataChannel = null;
      peerConnection = null;
      micStream = null;
      toolCompletionPromise = null;
      currentTurnEl = null;
      responseActive = false;
      clearWatchdog();
      setStatus("disconnected");
      setConnectedUi(false);
    }

    function sendTypedMessage() {
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = "";
      startTurn(`⌨️ You typed: "${text}"`);
      sendEvent({
        type: "conversation.item.create",
        item: { type: "message", role: "user", content: [{ type: "input_text", text }] },
      });
      requestResponse();
    }

    connectBtn.addEventListener("click", () => connect().catch((err) => showError(err.message)));
    disconnectBtn.addEventListener("click", disconnect);
    talkBtn.addEventListener("click", toggleTalk);
    sendBtn.addEventListener("click", sendTypedMessage);
    textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendTypedMessage(); });
  </script>
</body>
</html>
